<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">A simple content calendar</title><desc id="desc">A weekly publishing calendar with a few planned tasks.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f1f0e4"/><stop offset="1" stop-color="#dce7d7"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="17" flood-color="#455342" flood-opacity=".17"/></filter></defs>
  <rect width="1200" height="675" fill="url(#bg)"/><circle cx="1050" cy="89" r="188" fill="#d2dfc3" opacity=".6"/>
  <text x="74" y="174" fill="#687c59" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="5">MAKE A PLAN YOU CAN KEEP</text><text x="72" y="261" fill="#26392f" font-family="Georgia,serif" font-size="56" font-weight="700">Plan. Create.</text><text x="72" y="327" fill="#26392f" font-family="Georgia,serif" font-size="56" font-weight="700">Publish well.</text><text x="78" y="382" fill="#6c796b" font-family="Arial,sans-serif" font-size="22">A calm content calendar.</text>
