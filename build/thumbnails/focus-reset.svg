<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">A five-minute reset</title><desc id="desc">A calm notebook and cup beside the words Make room to think.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f4f1e7"/><stop offset="1" stop-color="#dce9d4"/></linearGradient><filter id="shadow" x="-.2" y="-.2" width="1.4" height="1.4"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#435b49" flood-opacity=".16"/></filter></defs>
  <rect width="1200" height="675" fill="url(#bg)"/><circle cx="1050" cy="80" r="190" fill="#c9dbbc" opacity=".55"/><circle cx="720" cy="630" r="200" fill="#e7d9bd" opacity=".4"/>
  <text x="82" y="173" fill="#58725b" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="5">A SMALL DAILY RESET</text><text x="78" y="260" fill="#20382d" font-family="Georgia,serif" font-size="58" font-weight="700">Make room</text><text x="78" y="326" fill="#20382d" font-family="Georgia,serif" font-size="58" font-weight="700">to think.</text><text x="82" y="380" fill="#66796b" font-family="Arial,sans-serif" font-size="22">Five minutes. One clear next step.</text>
