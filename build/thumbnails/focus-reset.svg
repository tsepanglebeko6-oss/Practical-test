  <g transform="translate(1010 470)"><path d="M0 0h82v75H0z" rx="12" fill="#b97855"/><path d="M82 15h22a22 22 0 0 1 0 44H82" fill="none" stroke="#b97855" stroke-width="12"/><path d="M18 18h46" stroke="#f3d7c1" stroke-width="6" stroke-linecap="round"/></g>
