<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Turn a goal into a weekly plan</title><desc id="desc">A weekly planner with small checked steps.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f2efe4"/><stop offset="1" stop-color="#dce8d5"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="15" stdDeviation="17" flood-color="#344c3e" flood-opacity=".17"/></filter></defs>
  <rect width="1200" height="675" fill="url(#bg)"/><circle cx="1030" cy="92" r="180" fill="#c3d5b5" opacity=".55"/>
  <text x="76" y="175" fill="#657b5b" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="5">PLAN THE NEXT STEP</text><text x="72" y="264" fill="#20382d" font-family="Georgia,serif" font-size="57" font-weight="700">Big goals,</text><text x="72" y="329" fill="#20382d" font-family="Georgia,serif" font-size="57" font-weight="700">small steps.</text><text x="78" y="382" fill="#66796b" font-family="Arial,sans-serif" font-size="22">A practical plan for this week.</text>
