services:
  - type: web
    name: creator-studio-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CREATOR_EMAIL
        sync: false
      - key: CREATOR_PASSWORD
        sync: false
      - key: CLIENT_URL
        sync: false
